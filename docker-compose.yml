version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chronicles_db
    restart: always
    environment:
      POSTGRES_DB: chronicles
      POSTGRES_USER: chronicles
      POSTGRES_PASSWORD: chroniclespassword
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronicles_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://chronicles:chroniclespassword@db:5432/chronicles
      JWT_SECRET: super-secret-key-summer-2026
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpassword
      UPLOAD_DIR: /app/uploads
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5001:5000"
    volumes:
      - media_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chronicles_web
    restart: always
    depends_on:
      - backend
    ports:
      - "8082:80"
    volumes:
      - media_data:/app/uploads

volumes:
  postgres_data:
  media_data:
